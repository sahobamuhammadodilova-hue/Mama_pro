<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mama Pro</title>
<style>
:root{--bg:#fff7f4;--card:#fff;--ink:#2a2d33;--mut:#7b7f86;--pri:#0a8e93;--pri2:#e0f3f3;--ok:#e0685a;--line:#f1e7e3;--track:#f6ece8;--sleep:#0a8e93;--sleep2:#8fd0d2;--feed:#fc917f;--dia:#d9604c;--oth:#5fa9ab;--red:#d24a3c;--coral:#fc917f;--shadow:0 1px 4px rgba(10,80,84,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#111819;--card:#1b2526;--ink:#eef4f4;--mut:#9fb1b2;--pri:#3fc0c5;--pri2:#17383a;--line:#2b3a3b;--track:#233031;--sleep:#3fc0c5;--sleep2:#2b7478;--feed:#fc917f;--dia:#f08a78;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.42 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:500px;margin:0 auto;min-height:100vh;padding:14px 14px 96px}
h1{font-size:23px;margin:0}h2{font-size:18px;margin:16px 0 8px}h3{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border-radius:18px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,#0a8e93 0%,#0a8e93 58%,#fc917f 135%);color:#fff;border-radius:22px;padding:16px;margin:4px 0 10px}
.hero .mut{color:rgba(255,255,255,.8)}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.btn{border:0;border-radius:14px;padding:13px 16px;font-size:16px;font-weight:600;background:var(--pri);color:#fff;width:100%;cursor:pointer}
.btn.sec{background:var(--pri2);color:var(--pri)}.btn.red{background:#ffe7e2;color:var(--red)}.btn.sm{width:auto;padding:8px 13px;font-size:14px}.btn.ok{background:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid3{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--card);border-radius:16px;padding:11px 2px;text-align:center;font-size:12px;border:0;cursor:pointer;color:var(--ink);box-shadow:var(--shadow)}
.tile b{display:block;font-size:25px;margin-bottom:2px;font-weight:400}
.tile.run{background:var(--pri);color:#fff}
.chip{display:inline-block;border:1.5px solid var(--line);border-radius:20px;padding:7px 12px;margin:3px 3px 3px 0;font-size:14px;background:var(--card);cursor:pointer;color:var(--ink)}
.chip.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:var(--card);color:var(--ink);font-family:inherit}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav div{display:flex;max-width:500px;margin:0 auto}
nav button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:11px;color:var(--mut);cursor:pointer}
nav button b{display:block;font-size:21px;font-weight:400}nav button.on{color:var(--pri);font-weight:700}
.big{font-size:32px;font-weight:700;line-height:1.1}.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;background:var(--pri2);color:var(--pri)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:500px;max-height:90vh;overflow:auto;padding:16px 16px 26px}
.tabs{display:flex;background:var(--track);border-radius:12px;padding:3px;margin:8px 0}
.tabs button{flex:1;border:0;background:none;padding:8px 2px;border-radius:10px;font-size:14px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--card);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:8px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;border-radius:4px 4px 0 0;min-height:0}
.log{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.log:last-child{border:0}.log .ic{font-size:21px;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--track)}
.x{background:none;border:0;color:var(--red);font-size:17px;cursor:pointer;padding:6px}
.err{color:var(--red);font-size:14px;margin-top:6px}
.disc{font-size:12px;color:var(--mut);margin-top:14px;text-align:center}
.chat{max-height:46vh;overflow:auto}.msg{padding:9px 12px;border-radius:14px;margin:6px 0;max-width:90%;white-space:pre-wrap}
.msg.u{background:var(--pri);color:#fff;margin-left:auto}.msg.a{background:var(--track)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 3px;text-align:center;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600}
.kids{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}
.kid{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:22px;padding:5px 13px 5px 5px;font-size:14px;display:flex;align-items:center;gap:7px;color:var(--ink);cursor:pointer;font-family:inherit}
.kid i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--pri2);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700}
.kid.on{border-color:var(--pri);background:var(--pri2);font-weight:700}.kid.on i{background:var(--pri);color:#fff}
.kid.add{padding:7px 13px;color:var(--pri);border-style:dashed}
.back{background:none;border:0;color:var(--pri);font-size:15px;padding:4px 0;cursor:pointer;font-weight:600}
.alert{background:#ffece7;color:#9a3f31;border-radius:14px;padding:11px 14px;margin:10px 0;font-size:14px}
@media(prefers-color-scheme:dark){.alert{background:#3f2723;color:#ffc2b6}.btn.red{background:#3d2220}}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mut);margin-top:6px;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:#0a4f52;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:30;display:flex;gap:14px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#toast button{background:none;border:0;color:#ffb8aa;font-weight:700;font-size:14px;cursor:pointer}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}

.tpb{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:18px;background:var(--card);color:var(--ink);font-family:inherit;cursor:pointer}
.tpb b{font-weight:700;letter-spacing:.5px}.tpb.empty b{color:var(--mut);font-weight:500}
.step{display:flex;align-items:center;justify-content:center;gap:22px;padding:6px 0}
.step button{width:52px;height:52px;border-radius:50%;border:0;background:var(--pri2);color:var(--pri);font-size:30px;font-weight:700;line-height:1;cursor:pointer}
.step b{font-size:34px;min-width:44px;text-align:center}
.tpm{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.tpbox{background:var(--card);color:var(--ink);border-radius:24px 24px 0 0;width:100%;max-width:500px;padding:16px 16px 22px}
.tpbox h3{margin:0 0 8px;text-align:center}
.tpw{position:relative;display:flex;justify-content:center;gap:6px;height:220px;margin:6px 0 12px}
.tpw:before{content:"";position:absolute;left:8px;right:8px;top:88px;height:44px;border-radius:12px;background:var(--pri2);z-index:0}
.tpc{position:relative;z-index:1;width:92px;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tpc::-webkit-scrollbar{display:none}
.tpc div{height:44px;line-height:44px;text-align:center;font-size:24px;scroll-snap-align:center;cursor:pointer}
.tpc .pad{height:88px;scroll-snap-align:none}
.tpsep{position:relative;z-index:1;font-size:26px;font-weight:700;line-height:220px}
.tpd{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:4px}
</style>
</head>

 if(!S.ms)S.ms={};Object.keys(S.ms).forEach(k=>{if(k.indexOf('|')<0&&f){S.ms[f+'|'+k]=S.ms[k];delete S.ms[k]}});

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>(n<10?'0':'')+n;
function dstr(ts){const d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
const tstr=ts=>{const d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes())};
const dtl=ts=>dstr(ts)+'T'+tstr(ts);
function dayStart(s){const a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]).getTime()}
function addDays(ds,n){const a=ds.split('-');return dstr(new Date(+a[0],+a[1]-1,+a[2]+n).getTime())}
function dur(ms){const m=Math.round(ms/60000);if(m<60)return m+' '+t('min');const h=Math.floor(m/60);return h+t('h')+(m%60?' '+(m%60)+' '+t('min'):'')}
function clock(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+':'+p2(m):m)+':'+p2(s%60)}
function ageM(){const b=new Date(S.child.birth),n=new Date();let m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth();if(n.getDate()<b.getDate())m--;return Math.max(0,m)}
function ageTxt(){const m=ageM();if(m<24)return m+' '+t('mo');const y=Math.floor(m/12),r=m%12;return y+' '+t('yr')+(r?' '+r+' '+t('mo'):'')}
function wakeWin(m){for(const w of WW)if(m<=w[0])return w[1];return 5}
const overlap=(a,b,s,e)=>Math.max(0,Math.min(b,e)-Math.max(a,s));
const hr=ts=>{const d=new Date(ts);return d.getHours()+d.getMinutes()/60};
const isNap=l=>{const h=hr(l.start);return h>=6&&h<18.5};
function logsOn(ds){const s=dayStart(ds),e=s+864e5;return LOGS().filter(l=>l.start<e&&(l.end||l.start)>=s).sort((a,b)=>a.start-b.start)}
function sleepSplit(ds){const s=dayStart(ds),e=s+864e5;let n=0,g=0;LOGS().forEach(l=>{if(l.type==='sleep'){const o=overlap(l.start,l.end,s,e);if(isNap(l))n+=o;else g+=o}});return[n,g]}
const sleepOn=ds=>{const a=sleepSplit(ds);return a[0]+a[1]};
const ICON={sleep:'🌙',feed:'🍼',diaper:'💧',pump:'🥛',med:'💊',temp:'🌡️',growth:'📏'};
const ic=l=>l.type==='act'?(ACTIC[(l.d||{}).kind]||'⭐'):ICON[l.type];
function detail(l){const d=l.d||{};let s='';switch(l.type){
case'sleep':s=t(isNap(l)?'nap':'night')+' · '+dur(l.end-l.start);break;
case'feed':if(d.mode==='nurse')s=t('nurse')+' · '+t(d.side||'B')+' · '+d.min+' '+t('min');else if(d.mode==='bottle')s=t('bottle')+' · '+d.ml+' ml · '+t(d.kind||'milk');else s=t('solid')+' · '+(d.foods||[]).map(i=>FOODS[i][R()]).join(', ');break;
case'diaper':s=t(d.kind==='potty'?'potty':'diaper')+' · '+t(d.what||'pee');break;
case'pump':s=t('pump')+' · '+d.ml+' ml'+(d.min?' · '+d.min+' '+t('min'):'');break;
case'med':s=t('med')+' · '+esc(d.name||'')+(d.dose?' · '+esc(d.dose):'');break;
case'temp':s=d.c+' °C';break;
case'growth':s=[d.h?d.h+' sm':'',d.w?d.w+' kg':'',d.hc?'⭕ '+d.hc+' sm':''].filter(Boolean).join(' · ');break;
case'act':s=t(d.kind)+(d.min?' · '+d.min+' '+t('min'):'');break}
return s+(l.note?' · “'+esc(l.note)+'”':'')}
const last=type=>LOGS().filter(l=>l.type===type).sort((x,y)=>y.start-x.start)[0];
function agoTxt(ts){const m=Math.max(0,Math.round((Date.now()-ts)/60000));return t('ago',{x:m<60?m+' '+t('min'):Math.floor(m/60)+t('h')+' '+(m%60)+' '+t('min')})}
function toast(msg,fn){let e=document.getElementById('toast');if(e)e.remove();e=document.createElement('div');e.id='toast';e.textContent=msg;if(fn){const b=document.createElement('button');b.textContent=t('undo');b.onclick=()=>{fn();e.remove()};e.appendChild(b)}document.body.appendChild(e);setTimeout(()=>{if(e.parentNode)e.remove()},5000)}

/* ---------- prediction ---------- */
function prediction(){
 if(TM().sleep)return null;
 const sl=LOGS().filter(l=>l.type==='sleep').sort((a,b)=>b.end-a.end);if(!sl.length)return{none:1};
 const w=wakeWin(ageM());let next=sl[0].end+w*36e5;
 const ds=dayStart(dstr(Date.now())),napsToday=LOGS().filter(l=>l.type==='sleep'&&l.start>=ds&&isNap(l)).length;
 let bed=false;if(napsToday>=S.child.naps){bed=true;next=Math.min(ds+21.5*36e5,Math.max(ds+19*36e5,next))}
 return{next,bed,diff:Math.round((next-Date.now())/60000)};
}

/* ---------- timers ---------- */
function startTimer(k){TT(k)[k]={start:Date.now()};save();render()}
function cancelTimer(k){delete TT(k)[k];save();render()}
function stopTimer(k){
 const tm=TT(k)[k];if(!tm)return;const now=Date.now(),mins=Math.max(1,Math.round((now-tm.start)/60000));delete TT(k)[k];
 const id=now+'_'+Math.floor(Math.random()*1e4);let L=null;
 if(k==='sleep')L={id,type:'sleep',start:tm.start,end:now,d:{}};
 else if(k==='nL'||k==='nR')L={id,type:'feed',start:tm.start,d:{mode:'nurse',side:k==='nL'?'L':'R',min:mins}};
 else if(k==='tummy')L={id,type:'act',start:tm.start,d:{kind:'tummy',min:mins}};
 else if(k==='pump')L={id,type:'pump',start:tm.start,d:{ml:0,min:mins}};
 else if(k==='contr'){S.contr.push({s:tm.start,e:now});if(S.contr.length>60)S.contr=S.contr.slice(-60);save();render();return}
 L.cid=S.cur;S.logs.push(L);save();
 if(k==='pump'){openEdit(id);return}
 render();toast(t('saved'));
}
const TIMER_META={sleep:['🌙','sleep'],nL:['🤱','nL'],nR:['🤱','nR'],pump:['🥛','pump'],tummy:['🐢','tummy']};

function tl(ds,h,labels){

 }
 h+=`<label>${t('note')}</label><input id="f_note" value="${esc(V('f_note',''))}">`;
 h+=`<div class="err">${ui.err}</div><div style="height:12px"></div><button class="btn" data-a="savelog">${t('save')}</button><div style="height:8px"></div><button class="btn sec" data-a="close">${t('cancel')}</button></div></div>`;
 return h;
}
function capture(){document.querySelectorAll('[id^=f_],[id^=ob_],[id^=pw_]').forEach(el=>{ui.vals[el.id]=el.value})}
const num=id=>{const v=parseFloat(ui.vals[id]);return isNaN(v)?0:v};
function openSheet(ty,extra){ui.vals={};ui.err='';ui.sheet=Object.assign({type:ty,mode:'nurse',side:'L',bk:'milk',foods:[],dk:'diaper',what:'pee',ak:'bath'},extra||{});render()}
function openEdit(id){
 const l=S.logs.find(x=>x.id===id);if(!l)return;const d=l.d||{};
 openSheet(l.type,{edit:id,mode:d.mode||'nurse',side:d.side||'L',bk:d.kind||'milk',foods:(d.foods||[]).slice(),dk:d.kind||'diaper',what:d.what||'pee',ak:d.kind||'bath'});
 const v={f_s:dtl(l.start),f_note:l.note||''};if(l.end)v.f_e=dtl(l.end);
 ['min','ml','name','dose','c','h','w','hc'].forEach(k=>{if(d[k]!=null&&d[k]!=='')v['f_'+k]=d[k]});
 ui.vals=v;render();
}
function saveLog(){
 capture();const sh=ui.sheet,ty=sh.type,L={id:sh.edit||Date.now()+'_'+Math.floor(Math.random()*1e4),type:ty,cid:S.cur,d:{}};
 let st=new Date(ui.vals.f_s||dtl(Date.now())).getTime();if(isNaN(st))st=Date.now();if(st>Date.now()+6e4&&!sh.edit)st-=864e5;L.start=st;
 if(ty==='sleep'){const en=new Date(ui.vals.f_e||dtl(Date.now())).getTime();if(!(en>st)){ui.err=t('errTime');render();return}L.end=en}
 if(ty==='feed'){L.d.mode=sh.mode;if(sh.mode==='nurse'){L.d.side=sh.side||'L';L.d.min=num('f_min')}if(sh.mode==='bottle'){L.d.ml=num('f_ml');L.d.kind=sh.bk}if(sh.mode==='solid'){if(!(sh.foods||[]).length){ui.err=t('errReq');render();return}L.d.foods=sh.foods}}
 if(ty==='diaper'){L.d.kind=sh.dk;L.d.what=sh.what}
 if(ty==='pump'){L.d.ml=num('f_ml');L.d.min=num('f_min')}
 if(ty==='med'){if(!(ui.vals.f_name||'').trim()){ui.err=t('errReq');render();return}L.d.name=ui.vals.f_name.trim();L.d.dose=ui.vals.f_dose||''}
 if(ty==='temp')L.d.c=num('f_c');
 if(ty==='growth'){L.d.h=num('f_h')||'';L.d.w=num('f_w')||'';L.d.hc=num('f_hc')||'';if(!L.d.h&&!L.d.w&&!L.d.hc){ui.err=t('errReq');render();return}}
 if(ty==='act'){L.d.kind=sh.ak;L.d.min=num('f_min')}
 if((ui.vals.f_note||'').trim())L.note=ui.vals.f_note.trim();
 if(sh.edit){const i=S.logs.findIndex(x=>x.id===sh.edit);if(i>-1)S.logs[i]=L;else S.logs.push(L)}else S.logs.push(L);
 save();ui.sheet=null;ui.vals={};ui.err='';render();toast(t('saved'));
}

/* ---------- plan, csv, ai ---------- */
function makePlan(){
 capture();if(!ui.vals.pw_wake||!ui.vals.pw_bed){toast(t('errPick'));return}const w=(ui.vals.pw_wake||'07:00').split(':'),n=+(ui.vals.pw_naps!=null?ui.vals.pw_naps:S.child.naps),bd=(ui.vals.pw_bed||'20:30').split(':'),ww=wakeWin(ageM())*60;
 let cur=+w[0]*60+ +w[1];const items=[{m:cur,k:'wake'}],nl=n>=3?60:90;
 for(let i=0;i<n;i++){cur+=ww;items.push({m:cur,k:'nap',n:dur(nl*6e4)});cur+=nl}
 cur+=ww;const target=+bd[0]*60+ +bd[1];if(Math.abs(cur-target)>90)cur=target;
 items.push({m:Math.round(cur),k:'night'});items.forEach(i=>i.m=Math.round(i.m)%1440);ui.plan={items};
}
function toCSV(){const rows=['type,start,end,details'];LOGS().slice().sort((a,b)=>a.start-b.start).forEach(l=>rows.push([l.type,new Date(l.start).toISOString(),l.end?new Date(l.end).toISOString():'','"'+detail(l).replace(/"/g,'""')+'"'].join(',')));return rows.join('\n')}
function aiReply(q){
 q=q.toLowerCase();const ru=R(),m=ageM(),w=wakeWin(m),ds=dstr(Date.now());
 const need=m<4?'14-17':m<12?'12-15':'11-14';
 if(/uxl|uyqu|сон|спит|спать|sleep/.test(q))return ru?`В этом возрасте малышу обычно нужно около ${need} часов сна в сутки, окно бодрствования ~${w} ч. Сегодня записано: ${dur(sleepOn(ds))}. Подробнее — «Режим дня» в разделе «Ещё». Если сон резко изменился, спросите педиатра.`:`Shu yoshda bolaga sutkada taxminan ${need} soat uyqu kerak, uyg'oq turish ~${w} soat. Bugun yozilgan: ${dur(sleepOn(ds))}. Batafsil: «Yana» → «Kun tartibi». Uyqu keskin o'zgarsa, shifokordan so'rang.`;
 if(/ovqat|sut|emiz|ем|корм|прикорм|еда|solid/.test(q))return ru?'Прикорм обычно вводят с 6 месяцев, по одному новому продукту, наблюдая за реакцией (см. «Дневник прикорма»). Аллергены вводите осторожно. Конкретный план обсудите с педиатром.':'Qattiq ovqat odatda 6 oylikdan boshlanadi: bir vaqtda bitta yangi mahsulot, reaksiyani kuzatib («Ovqat daftari»). Allergenlarni ehtiyotkorlik bilan kiriting. Aniq reja uchun shifokorga murojaat qiling.';
 if(/harorat|isitma|темп|жар|лихорад|fever/.test(q))return ru?'Температура 38°C и выше, особенно у малыша младше 3 месяцев, — повод сразу обратиться к врачу. Не давайте лекарства без назначения врача.':'Harorat 38°C va undan yuqori bo\'lsa, ayniqsa 3 oylikdan kichik bolada, darhol shifokorga murojaat qiling. Dorini shifokor aytmasdan bermang.';
 if(/taglik|подгуз|pee|siydik|najas/.test(q))return ru?'В среднем младенцы мочатся 6+ раз в день. Если подгузники резко стали сухими, малыш вялый или вы волнуетесь — обратитесь к врачу.':'Chaqaloqlar odatda kuniga 6 va undan ko\'p marta siyadi. Taglik keskin quruq bo\'lsa yoki bola holsiz bo\'lsa, shifokorga murojaat qiling.';
 return ru?'Это демо-версия помощника: пока я отвечаю на вопросы про сон, питание, температуру и подгузники. Полноценный ИИ подключим на следующем этапе.':'Bu yordamchining sinov varianti: hozircha uyqu, ovqat, harorat va taglik haqidagi savollarga javob beraman. To\'liq AI keyingi bosqichda.';
}


/* ---------- pickers (soat, son, sana) ---------- */
function TP(id,val,def){return `<button type="button" class="tpb ${val?'':'empty'}" data-a="tp" data-v="${id}" data-def="${def||'07:00'}">🕒 <b id="${id}_d">${val||t('tpPick')}</b></button><input type="hidden" id="${id}" value="${val||''}">`}
function STEP(id,val,mn,mx){return `<div class="step"><button type="button" data-a="stp" data-v="${id}|-1|${mn}|${mx}">−</button><b id="${id}_d">${val}</b><button type="button" data-a="stp" data-v="${id}|1|${mn}|${mx}">+</button></div><input type="hidden" id="${id}" value="${val}">`}
function dtLabel(v){if(!v)return t('tpPick');const d=v.slice(0,10),tm=v.slice(11,16);const td=dstr(Date.now()),yd=dstr(Date.now()-864e5);return (d===td?t('tpToday'):d===yd?t('tpYest'):v.slice(8,10)+'.'+v.slice(5,7))+', '+tm}
function DTP(id,val){return `<button type="button" class="tpb" data-a="dtp" data-v="${id}">🕒 <b id="${id}_d">${dtLabel(val)}</b></button><input type="hidden" id="${id}" value="${val}">`}
function openPicker(id,withDate,defTime){
 const inp=document.getElementById(id);if(!inp)return;
 let cur=inp.value||'',day,hh,mm;
 if(withDate){day=(cur||dtl(Date.now())).slice(0,10);cur=(cur||dtl(Date.now())).slice(11,16)}
 else if(!cur)cur=defTime||'07:00';
 hh=+cur.split(':')[0];mm=+cur.split(':')[1];
 const box=document.createElement('div');box.className='tpm';
 let dh='';
 if(withDate){const ds=[0,1,2,3].map(k=>dstr(Date.now()-k*864e5));dh='<div class="tpd">'+ds.map((d,k)=>`<button type="button" class="chip" data-day="${d}" style="${d===day?'background:var(--pri);color:#fff;border-color:var(--pri)':''}">${k===0?t('tpToday'):k===1?t('tpYest'):d.slice(8,10)+'.'+d.slice(5,7)}</button>`).join('')+'</div>'}
 const col=(n,sel)=>{let x='<div class="pad"></div>';for(let i=0;i<n;i++)x+=`<div data-i="${i}">${p2(i)}</div>`;return x+'<div class="pad"></div>'};
 box.innerHTML=`<div class="tpbox"><h3>${t('tpTitle')}</h3>${dh}<div class="tpw"><div class="tpc" id="tp_h">${col(24)}</div><div class="tpsep">:</div><div class="tpc" id="tp_m">${col(60)}</div></div><button type="button" class="btn" id="tp_ok">${t('tpOk')}</button><div style="height:8px"></div><button type="button" class="btn sec" id="tp_x">${t('cancel')}</button></div>`;
 document.body.appendChild(box);
 const H=box.querySelector('#tp_h'),M=box.querySelector('#tp_m');
 H.scrollTop=hh*44;M.scrollTop=mm*44;
 [H,M].forEach(c=>c.addEventListener('click',e=>{const it=e.target.closest('[data-i]');if(it)c.scrollTo({top:+it.getAttribute('data-i')*44,behavior:'smooth'})}));
 box.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{day=b.getAttribute('data-day');box.querySelectorAll('[data-day]').forEach(x=>{const on=x===b;x.style.background=on?'var(--pri)':'';x.style.color=on?'#fff':'';x.style.borderColor=on?'var(--pri)':''})}));
 const close=()=>box.remove();
 box.addEventListener('click',e=>{if(e.target===box)close()});
 box.querySelector('#tp_x').onclick=close;
 box.querySelector('#tp_ok').onclick=()=>{
  const h=Math.min(23,Math.max(0,Math.round(H.scrollTop/44))),m=Math.min(59,Math.max(0,Math.round(M.scrollTop/44)));
  const tm=p2(h)+':'+p2(m),val=withDate?day+'T'+tm:tm;
  inp.value=val;ui.vals[id]=val;
  const d=document.getElementById(id+'_d');if(d)d.textContent=withDate?dtLabel(val):tm;
  const b=d&&d.closest('.tpb');if(b)b.classList.remove('empty');
  close();
 };
}
/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;
 const a=el.getAttribute('data-a'),v=el.getAttribute('data-v');
 switch(a){
 case'tp':openPicker(v,false,el.getAttribute('data-def'));break;
 case'dtp':openPicker(v,true);break;
 case'stp':{const q=v.split('|'),i=document.getElementById(q[0]);if(!i)break;const nv=Math.min(+q[3],Math.max(+q[2],(+i.value||0)+ +q[1]));i.value=nv;ui.vals[q[0]]=String(nv);const d=document.getElementById(q[0]+'_d');if(d)d.textContent=nv;break}
 case'bg':if(e.target===el){capture();ui.sheet=null;render()}break;
 case'lang':S.lang=v;save();render();break;
 case'obnext':{
  const g=id=>document.getElementById(id);
  if(ui.ob===1){const n=g('ob_name').value.trim();if(!n){ui.err=t('errReq');render();break}ui.vals.ob_name=n;ui.ob=2;ui.err=''}
  else if(ui.ob===2){const b=g('ob_birth').value;if(!b){ui.err=t('errReq');render();break}ui.vals.ob_birth=b;ui.ob=3;ui.err=''}
  else if(ui.ob===3){ui.vals.ob_naps=g('ob_naps').value;ui.ob=4}
  else if(ui.ob===4){const wk=g('ob_wake').value,bd=g('ob_bed').value;if(!wk||!bd){ui.vals.ob_wake=wk;ui.vals.ob_bed=bd;ui.err=t('errPick');render();break}addChildObj({name:ui.vals.ob_name,birth:ui.vals.ob_birth,naps:+ui.vals.ob_naps,wake:wk,bed:bd});ui.vals={};ui.ob=1;ui.err=''}
  render();break}
 case'tab':ui.tab=v;ui.more=null;render();window.scrollTo(0,0);break;
 case'sub':ui.sub=v;render();break;
 case'more':ui.more=v||null;ui.plan=null;ui.vals={};render();window.scrollTo(0,0);break;
 case'startT':startTimer(v);break;
 case'stopT':stopTimer(v);break;
 case'cancelT':cancelTimer(v);break;
 case'open':openSheet(v);break;
 case'openfood':openSheet('feed',{mode:'solid'});break;
 case'edit':openEdit(v);break;
 case'close':ui.sheet=null;ui.vals={};ui.err='';render();break;
 case'mode':capture();ui.sheet.mode=v;render();break;
 case'chip':{capture();const k=el.getAttribute('data-k'),sh=ui.sheet;
  if(el.getAttribute('data-m')==='1'){const i=+v,arr=sh.foods||[],ix=arr.indexOf(i);if(ix>-1)arr.splice(ix,1);else arr.push(i);sh.foods=arr}
  else sh[k]=v;render();break}
 case'savelog':saveLog();break;
 case'del':{const l=S.logs.find(x=>x.id===v);S.logs=S.logs.filter(x=>x.id!==v);save();render();toast(t('deleted'),()=>{S.logs.push(l);save();render()});break}
 case'dprev':ui.date=addDays(ui.date,-1);render();break;
 case'dnext':ui.date=addDays(ui.date,1);render();break;
 case'filter':ui.filter=v;render();break;
 case'ms':if(S.ms[v])delete S.ms[v];else S.ms[v]=1;save();render();break;
 case'plan':makePlan();render();break;
 case'savePlan':S.plans[S.cur]=ui.plan;save();toast(t('saved'));break;
 case'clrContr':S.contr=[];save();render();break;
 case'csv':ui.csv=toCSV();render();break;
 case'ask':{const q=(document.getElementById('f_q').value||'').trim();if(!q)break;S.chat.push({r:'u',x:q},{r:'a',x:aiReply(q)});if(S.chat.length>40)S.chat=S.chat.slice(-40);save();ui.vals={};render();const c=document.getElementById('chat');if(c)c.scrollTop=c.scrollHeight;break}
 case'kid':S.cur=v;normalize();ui.plan=null;ui.delKid=null;save();render();window.scrollTo(0,0);break
 case'addkid':ui.vals={};ui.err='';ui.sheet={type:'child'};render();break
 case'savekid':{capture();const nm=(ui.vals.f_cname||'').trim(),bd=ui.vals.f_cbirth;if(!nm||!bd){ui.err=t('errReq');render();break}if(!ui.vals.f_cwake||!ui.vals.f_cbed){ui.err=t('errPick');render();break}addChildObj({name:nm,birth:bd,naps:+(ui.vals.f_cnaps||0),wake:ui.vals.f_cwake,bed:ui.vals.f_cbed});ui.sheet=null;ui.vals={};ui.err='';ui.plan=null;ui.tab='home';render();toast(t('kidAdded'));break}
 case'delkid':{if(S.children.length<2){toast(t('onlyOne'));break}if(ui.delKid!==v){ui.delKid=v;render();break}S.children=S.children.filter(c=>c.id!==v);S.logs=S.logs.filter(l=>l.cid!==v);delete S.tm[v];delete S.plans[v];Object.keys(S.ms).forEach(k=>{if(k.indexOf(v+'|')===0)delete S.ms[k]});ui.delKid=null;normalize();save();render();toast(t('kidDeleted'));break}
 case'lang2':S.lang=v;save();render();break;
 case'cfg':S.cfg[v]=S.cfg[v]?0:1;save();render();break;
 case'saveset':{const g=id=>document.getElementById(id).value;S.child.name=g('s_name').trim()||S.child.name;if(g('s_birth'))S.child.birth=g('s_birth');S.child.naps=+g('s_naps');S.child.wake=g('s_wake')||S.child.wake;S.child.bed=g('s_bed')||S.child.bed;save();toast(t('saved'));ui.more=null;render();break}
 case'exp':ui.json=JSON.stringify(S);render();break;
 case'imp':{try{const o=JSON.parse(document.getElementById('f_json').value);if(!o||!Array.isArray(o.logs))throw 0;S=Object.assign(DEF(),o);S.cfg=Object.assign(DEF().cfg,S.cfg||{});normalize();save();ui.json='';render();toast(t('impOk'))}catch(x){toast(t('impBad'))}break}
 case'reset':if(!ui.rst){ui.rst=1;render();break}S=DEF();normalize();save();ui=NUI();render();break;
 }
});
document.addEventListener('change',e=>{if(e.target.id==='rdate'){ui.date=e.target.value||dstr(Date.now());render()}});
render();
setInterval(()=>{document.querySelectorAll('[data-tm]').forEach(el=>{el.textContent=clock(Date.now()-(+el.getAttribute('data-tm')))})},1000);
setInterval(()=>{if(S.child&&ui.tab==='home'&&!ui.sheet)render()},60000);
})();
</script>
